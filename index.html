
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In Between Pages - Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>


<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #DBCEBB;
    color: #503A26;
  }

  .container {
    max-width: 480px;
    margin: 20px auto;
    background: #F8F3EC;
    padding: 24px;
    border: 1px solid #827454;
    border-radius: 14px;
    text-align: center;
  }

  .brand-logo {
    width: 140px;
    max-width: 65%;
    height: auto;
    border-radius: 12px;
    margin-bottom: 12px;
  }

  h2 {
    margin: 0 0 18px;
    font-family: Georgia, serif;
    color: #503A26;
  }

  video {
    display: block;
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    margin: 12px 0;
    background: #DBCEBB;
  }

  button {
    border: none;
    padding: 13px 16px;
    border-radius: 8px;
    margin: 5px 3px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  #startButton,
  #sendButton {
    background: #966F50;
    color: white;
  }

  #stopButton {
    background: #D9B9A1;
    color: #503A26;
  }

  input {
    width: 100%;
    padding: 13px;
    border: 1px solid #827454;
    border-radius: 8px;
    font-size: 16px;
    margin: 10px 0;
    background: white;
    color: #503A26;
  }

  #sendButton {
    width: 100%;
    margin: 8px 0;
  }

  #status {
    margin: 12px 0;
    font-size: 13px;
    color: #80674D;
  }

  @media (max-width: 600px) {
    body {
      padding: 12px;
    }

    .container {
      margin: 10px auto;
      padding: 18px;
    }

    .brand-logo {
      width: 120px;
    }
  }
</style>

</head>

<body>
  <div class="container">
  <img
  src="https://raw.githubusercontent.com/inbetweenpages011/in-between-pages-scanner/main/in_between_pages.svg"
  alt="In Between Pages Logo"
  class="brand-logo"
>

<h2>Barcode Scanner</h2>

    <div id="status">Ready to scan your book.</div>

    <video id="video" playsinline></video>

    <div>
      <button id="startButton">Start Scanner</button>
      <button id="stopButton">Stop Scanner</button>
    </div>

    <input id="isbn" type="text" placeholder="Enter ISBN">

    <br>
    <button id="sendButton">Send ISBN to Inventory</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const isbnInput = document.getElementById('isbn');

    let scannerControls = null;

    function stopScanner() {
      if (scannerControls) {
        scannerControls.stop();
        scannerControls = null;
      }

      video.pause();
      video.srcObject = null;
      status.textContent = 'Scanner stopped.';
    }

    async function startScanner() {
      if (typeof ZXingBrowser === 'undefined') {
        status.textContent = 'Scanner library could not load. Refresh the page.';
        return;
      }

      try {
        status.textContent = 'Starting camera...';

        const reader = new ZXingBrowser.BrowserMultiFormatReader();

        scannerControls = await reader.decodeFromConstraints(
          {
            video: {
              facingMode: { ideal: 'environment' }
            }
          },
          video,
          (result, error) => {
            if (result) {
              isbnInput.value = result.getText();
              status.textContent = 'Barcode detected!';

              stopScanner();
            }
          }
        );

        status.textContent = 'Point your camera at the book barcode.';
      } catch (error) {
        status.textContent = 'Camera error: ' + error.message;
      }
    }

    function sendISBN() {
      const isbn = isbnInput.value.trim().replace(/[\s-]/g, '');

      if (!isbn) {
        status.textContent = 'Please scan or enter an ISBN first.';
        return;
      }

      if (!/^(97[89]\d{10}|\d{9}[\dX])$/i.test(isbn)) {
        status.textContent = 'Please enter a valid ISBN-10 or ISBN-13.';
        return;
      }

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
  { type: 'BOOK_ISBN_SCANNED', isbn: isbn },
  '*'
);

        status.textContent = 'ISBN sent to your inventory!';
        setTimeout(() => window.close(), 800);
      } else {
        status.textContent = 'No inventory window found. Keep this ISBN: ' + isbn;
      }
    }

    document.getElementById('startButton').addEventListener('click', startScanner);
    document.getElementById('stopButton').addEventListener('click', stopScanner);
    document.getElementById('sendButton').addEventListener('click', sendISBN);
  </script>
</body>
</html>
